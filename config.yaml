# Configuracion del analisis. Puedes cambiar estos valores sin tocar codigo.
# Las distancias van en "anchuras de hombro" para no depender de lo cerca que este la camara.

# Guardia del boxeador: orthodox (mano adelantada = izquierda) o southpaw (mano adelantada = derecha)
stance: orthodox

video:
  max_height: 720        # se reduce el video a esta altura (px) para ir rapido
  max_seconds: 60        # se analiza como maximo este tiempo

pose:
  model: models/pose_landmarker_full.task
  min_visibility: 0.5    # se ignoran puntos con visibilidad menor
  smooth_seconds: 0.1    # ventana de suavizado (mediana movil)
  max_gap_seconds: 0.2   # huecos sin deteccion mas cortos que esto se rellenan interpolando

# 1. Guardia: una mano esta "arriba" si la muneca esta cerca de la nariz y, ademas, segun "rule":
#    elbow:     por encima del codo (no depende de la inclinacion del cuerpo) <- elegida tras calibrar
#    shoulders: no mas abajo de la linea de hombros que max_below_shoulder
guard:
  rule: elbow
  max_dist_nose: 0.8       # distancia maxima muneca-nariz
  max_below_shoulder: 0.15 # (solo regla shoulders) margen por debajo de la linea de hombros

# Las metricas se calculan solo en el tramo activo: desde este tiempo antes del primer golpe
# hasta este tiempo despues del ultimo (no cuenta entrar en plano ni prepararse)
active_margin_seconds: 1.0

# Deteccion de golpes: se basa sobre todo en la muneca (se aleja del hombro rapido).
# El codo solo filtra; la extension buena (160) se valora aparte, en "extension".
punches:
  min_reach_increase: 0.3    # aumento minimo de la distancia muneca-hombro durante el golpe
  min_peak_speed: 3.0        # velocidad pico minima de la muneca (anchuras de hombro por segundo)
  max_rise_seconds: 0.4      # tiempo maximo desde la mano recogida hasta el pico del golpe
  angle_min: 125             # angulo minimo del codo en el pico para contar como golpe, grados
  min_gap_between_hands: 0.15  # si las dos manos "golpean" mas juntas que esto, solo cuenta la que mas se aleja
  max_wrist_below_shoulder: 0.5  # en el pico, la muneca no puede estar mas abajo que esto respecto a los hombros
                                 # (evita contar como golpe bajar el brazo)
  debounce_seconds: 0.25     # no contar dos golpes de la misma mano tan seguidos

# 3. Extension: angulo del codo en el pico del golpe
extension:
  good_angle: 160

# 4. Vuelta a la guardia tras el golpe: desde el pico hasta que esa mano esta arriba (regla de guardia)
#    con el brazo recogido, antes del pico del siguiente golpe
recovery:
  max_elbow_angle: 90    # brazo recogido = codo por debajo de esto, grados (de perfil, el puno estirado
                         # queda delante de la cara y la regla de guardia sola lo daba por arriba)
  max_seconds: 1.5       # si no vuelve antes del siguiente golpe ni en este tiempo, cuenta como este tiempo

# 5. Base: separacion de pies y rodillas flexionadas
base:
  min_ratio: 1.0         # distancia entre tobillos / anchura de hombros, minimo
  max_ratio: 1.6         # idem, maximo
  max_knee_angle: 170    # angulo medio cadera-rodilla-tobillo por debajo de esto = rodillas flexionadas

# Control de calidad de la grabacion: NO cambia la nota, solo indica su fiabilidad (alta / media / baja).
# La fiabilidad final es la del peor de los tres factores. Valores elegidos con los 5 clips de prueba
# (ver docs/DECISIONES.md, punto 7).
quality:
  min_visible_high: 75     # % del tramo activo con nariz, hombros, codos y munecas visibles: desde aqui, alta
  min_visible_medium: 50   # por debajo de esto, baja
  max_wrist_out_high: 3    # % del tiempo con una muneca fuera del encuadre: hasta aqui, alta
  max_wrist_out_medium: 10 # por encima de esto, baja
  edge_margin: 0.3         # muneca a menos de estas anchuras de hombro del borde = mano fuera del encuadre
  max_front_high: 0.60     # anchura de hombros / altura del tronco: hasta aqui, de lado o en diagonal (alta)
  max_front_medium: 0.70   # por encima de esto, de frente (baja)

# Puntuacion: cada metrica se convierte en 0-100 con una recta entre "bad" (0 puntos) y "good" (100 puntos).
# Si "good" es menor que "bad", menos es mejor (p. ej. tiempo de vuelta a la guardia).
# El total es la media ponderada por "weight". Con weight 0 la metrica se muestra pero no puntua ni da consejos.
scoring:
  guard:        {metric: guard_pct,          bad: 40,  good: 90,  weight: 25}   # % frames con las dos manos arriba
  other_hand:   {metric: other_hand_up_pct,  bad: 40,  good: 90,  weight: 20}   # % golpes con la otra mano arriba
  extension:    {metric: extended_pct,       bad: 30,  good: 80,  weight: 20}   # % golpes con el codo >= good_angle
  recovery:     {metric: recovery_mean_s,    bad: 0.8, good: 0.4, weight: 15}   # segundos medios de vuelta a la guardia
  base:         {metric: base_pct,           bad: 30,  good: 80,  weight: 0}    # % frames con base correcta
                                                                                  # (peso 0: de perfil no se puede medir)
  volume:       {metric: punches_per_min,    bad: 20,  good: 70,  weight: 10}   # golpes por minuto
